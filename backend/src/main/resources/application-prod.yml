spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/teaching_competition?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-path: ${FILE_STORAGE_LOCAL_PATH:/opt/teaching-competition/uploads}
    domain: ${FILE_STORAGE_DOMAIN:}

logging:
  level:
    root: INFO
